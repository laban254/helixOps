# HelixOps Configuration

# Application settings
app:
  host: "0.0.0.0"
  port: 8080
  log_level: "info"

# Prometheus configuration
prometheus:
  url: "http://prometheus:9090"
  timeout: "30s"

# Loki configuration
loki:
  url: "http://loki:3100"
  timeout: "30s"

# GitHub configuration
github:
  api_url: "https://api.github.com"
  token_env: "GITHUB_TOKEN"
  # Token is loaded from GITHUB_TOKEN environment variable

# Tempo configuration
tempo:
  url: "http://tempo:3200"
  enabled: true
  slow_span_threshold_ms: 500
  search_limit: 20

# LLM configuration
llm:
  provider: "ollama"  # Options: openai, anthropic, deepseek, ollama
  # `model` applies to openai/anthropic/deepseek only (e.g. gpt-4o, claude-3-5-sonnet-20241022, deepseek-chat).
  # It is IGNORED when provider is "ollama" — Ollama uses `ollama_model` below.
  model: "gpt-4o"
  temperature: 0.1
  max_tokens: 1000
  # For cloud providers, the API key is read from an env var per provider:
  #   openai -> OPENAI_API_KEY, anthropic -> ANTHROPIC_API_KEY, deepseek -> DEEPSEEK_API_KEY
  ollama_url: "http://ollama:11434"
  ollama_model: "qwen2.5:0.5b"  # Lightweight model (~400MB) for CPU-only environments

# Output channels (Slack + Markdown for MVP)
output:
  slack:
    webhook_url_env: "SLACK_WEBHOOK_URL"
    enabled: true
  markdown:
    output_dir: "./reports"
    enabled: true
  # Future: Discord, Teams, PagerDuty, webhooks

# Analysis settings
analysis:
  metrics_window: "15m"
  commits_lookback: "24h"
  logs_lookback: "1h"

# Database for incident history
# Supports: postgres (default) or sqlite
database:
  enabled: true
  type: "sqlite"              # "postgres" or "sqlite"
  path: "/app/data/helixops.db"  # SQLite file path (only used when type=sqlite)
  host: "postgres"            # Only used when type=postgres
  port: 5432                  # Only used when type=postgres
  user: "helixops"            # Only used when type=postgres
  dbname: "helixops"          # Only used when type=postgres
  sslmode: "disable"          # Only used when type=postgres
  # Password loaded from HELIX_DB_PASSWORD environment variable (only used when type=postgres)
